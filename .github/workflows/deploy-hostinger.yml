name: Deploy to Hostinger

# Push to main → package webhosting/public_html → upload to vva.chrif.net →
# extract → verify. Nothing long-running ever runs on the server: this is the
# same upload + extract sequence the site was first deployed with.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-vva-chrif-net
  cancel-in-progress: false

jobs:
  deploy:
    name: Package & deploy public_html
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # .env is never stored in git — CI regenerates it from secrets.
      - name: Recreate .env
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VIDKRAKEN_API_KEY: ${{ secrets.VIDKRAKEN_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Secret NVIDIA_API_KEY is not set on the repository"
            exit 1
          fi
          if [ -z "$VIDKRAKEN_API_KEY" ]; then
            echo "::error::Secret VIDKRAKEN_API_KEY is not set on the repository"
            exit 1
          fi
          {
            echo "NVIDIA_API_KEY=$NVIDIA_API_KEY"
            echo "NVIDIA_API_BASE=https://integrate.api.nvidia.com/v1"
            # VidKraken is the only download source — the site cannot run without it.
            echo "VIDKRAKEN_API_KEY=$VIDKRAKEN_API_KEY"
          } > webhosting/public_html/.env

      # Dot-prefixed name: .htaccess denies every dotfile, so the archive can
      # never be downloaded even while it sits in public_html.
      # The precompressed encoder core is generated here (not committed): the
      # server does not gzip .wasm, and the page fetches the .gz copy — 10 MB
      # instead of 33 MB on the wire. media.js falls back to the raw file if
      # this copy is ever missing.
      - name: Package public_html
        run: |
          cd webhosting/public_html
          gzip -9 -c assets/ffmpeg/ffmpeg-core.wasm > assets/ffmpeg/ffmpeg-core.wasm.gz
          ls -la assets/ffmpeg/
          zip -qr "$RUNNER_TEMP/.deploy-$(date -u +%Y%m%d_%H%M%S).zip" .
          ls -la "$RUNNER_TEMP"/.deploy-*.zip

      - name: Upload & extract on Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: bash scripts/deploy-hostinger.sh "$RUNNER_TEMP"/.deploy-*.zip

      # Smoke tests run from GitHub's network (Hostinger rate-limits the
      # deployer's own IP) and exercise the real pipeline: source search →
      # stream resolution → byte relay. The AI check only warns, so NVIDIA
      # flakiness never blocks a deploy.
      - name: Verify live site
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://vva.chrif.net/api/categories.php || true)
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP ${code:-none}"; sleep 10
          done
          [ "$code" = "200" ] || fail "vva.chrif.net did not answer HTTP 200"

          post() { curl -s --max-time 90 -X POST "$1" -H 'Content-Type: application/json' --data "$2"; }

          echo "→ VidKraken wiring (free /me probe — spends no download credit)"
          out=$(post https://vva.chrif.net/api/vidkraken.php '{"action":"quota"}') \
            || fail "vidkraken.php request failed"
          if [ "$(jq -r '.ok' <<<"$out" 2>/dev/null)" != "true" ]; then
            err=$(jq -r '.error // "unknown"' <<<"$out" 2>/dev/null || echo "$out")
            case "$err" in
              *not\ configured*) fail "VIDKRAKEN_API_KEY is not wired into .env: $err" ;;
              *) echo "::warning::VidKraken unreachable from the server: $err" ;;
            esac
          else
            echo "  plan $(jq -r '.plan' <<<"$out"), $(jq -r '.downloads' <<<"$out") downloads left"
          fi

          echo "→ YouTube discovery search"
          search=$(post https://vva.chrif.net/api/search.php '{"query":"funny dog","limit":3}') \
            || fail "search request failed"
          n=$(jq '.videos | length' <<<"$search" 2>/dev/null || echo 0)
          if [ "${n:-0}" -le 0 ]; then
            echo "::warning::YouTube search returned nothing from CI egress — skipping the relay test"
          else
            id=$(jq -r '.videos[0].id' <<<"$search")
            echo "  $n candidates, first: $id"

            echo "→ thumbnails"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://vva.chrif.net/api/thumb.php?id=$id" || true)
            [ "$code" = "200" ] || echo "::warning::thumb proxy returned $code"

            echo "→ stream resolution (the built-in fallback path)"
            out=$(post https://vva.chrif.net/api/player.php "{\"id\":\"$id\",\"provider\":\"youtube\"}") \
              || fail "player request failed"
            url=$(jq -r '([(.streams // [])[] | select(.kind == "video" and ((.mimeType // "") | contains("mp4")) | .url)] | first) // empty' <<<"$out")
            if [ -z "$url" ]; then
              echo "::warning::no mp4 stream (YouTube may be blocking CI egress): $(head -c 200 <<<"$out")"
            else
              echo "  stream: $(head -c 90 <<<"$url")…"

              echo "→ byte relay (range.php)"
              enc=$(printf '%s' "$url" | base64 -w 0 | tr '+/' '-_' | tr -d '=')
              echo "  u param: $(printf '%s' "$enc" | cut -c1-60)… (${#enc} chars)"
              code=$(curl -sS -o /tmp/chunk.bin -D /tmp/chunk.h -w '%{http_code}' --max-time 60 \
                -H 'Range: bytes=0-65535' "https://vva.chrif.net/api/range.php?u=$enc" 2>/tmp/curl.err || true)
              echo "  curl -> ${code:-000} $(head -c 200 /tmp/curl.err 2>/dev/null)"
              [ "$code" = "206" ] || fail "range relay returned $code"
              grep -qi '^content-range: bytes 0-65535/' /tmp/chunk.h || fail "missing Content-Range"
              head -c 12 /tmp/chunk.bin | grep -q ftyp || fail "first bytes are not an mp4"
              echo "  206 + Content-Range + ftyp ✓"
            fi
          fi

          echo "→ AI endpoint (non-blocking)"
          # Reasoning models burn ~20-150 tokens thinking before answering:
          # maxTokens must give them headroom or the reply comes back empty.
          code=$(curl -s -o /tmp/ai.json -w '%{http_code}' --max-time 120 -X POST \
            https://vva.chrif.net/api/ai.php -H 'Content-Type: application/json' \
            --data '{"system":"Reply with only JSON.","user":"Return {\"ok\":true}","maxTokens":1024}' || true)
          if [ "$code" = "200" ]; then echo "  ai: $(jq -r .model /tmp/ai.json)"; else echo "::warning::ai.php returned $code: $(head -c 300 /tmp/ai.json 2>/dev/null)"; fi

          echo "all smoke tests passed"
